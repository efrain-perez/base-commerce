services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: gilacommerce
      POSTGRES_USER: gila_app
      POSTGRES_PASSWORD: gilacommerce_dev_pw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gila_app -d gilacommerce"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - gila_postgres_data:/var/lib/postgresql

  backend:
    image: ghcr.io/efrain-perez/base-commerce-backend:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gilacommerce
      SPRING_DATASOURCE_USERNAME: gila_app
      SPRING_DATASOURCE_PASSWORD: gilacommerce_dev_pw
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/efrain-perez/base-commerce-frontend:latest
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  gila_postgres_data:
